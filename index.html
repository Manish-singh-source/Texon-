    <style>
        /* Existing color */
        .blc2{
            color: #ff5744;
        }

        /* ===== FIXES TO ENSURE MAILTO CLICKABLE ===== */

        /* Make sure background video never blocks clicks */
        #bgVideo{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;              /* keep it behind everything */
            pointer-events: none;     /* crucial: let clicks pass through the video */
        }

        /* Page content should sit above video */
        .page{
            position: relative;
            z-index: 2;
        }

        /* Loader or invisible overlays must not block clicks (unless intentionally interactive) */
        .page-loader{
            pointer-events: none;
        }

        /* Ensure the welcome text and links can receive pointer events */
        .welcome, .welcome * {
            pointer-events: auto;
            position: relative;
            z-index: 3;
        }

        /* Force mailto links to be clickable even if other styles try to disable them */
        a[href^="mailto:"]{
            pointer-events: auto !important;
            position: relative;
            z-index: 9999 !important;
            text-decoration: underline;
            color: inherit;
        }

        /* Some templates add pointer-events: none on anchors; override that */
        a{
            -webkit-tap-highlight-color: rgba(0,0,0,0.05);
        }
        a[href^="mailto:"] {
    pointer-events: auto !important;
    position: relative;
    z-index: 9999 !important;
    text-decoration: underline;
    color: #f4b41a;

}
